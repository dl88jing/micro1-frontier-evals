name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (stdlib unittest; openai optional)
        run: |
          python -m pip install --upgrade pip
          # Graders/tests need no third-party deps; keep install for scripts parity.
          pip install -r requirements.txt || true
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Oracle 10/10
        run: python graders/run_all.py
